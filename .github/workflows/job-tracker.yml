name: Job opening tracker

on:
  schedule:
    - cron: "30 3 * * *" # 09:00 IST daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job_tracker/requirements.txt

      - run: pip install -r job_tracker/requirements.txt

      - name: Fetch, filter and write JOBS.md
        run: python job_tracker/track.py
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A JOBS.md docs job_tracker
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update job openings"
            git push
          fi
