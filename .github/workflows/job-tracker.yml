name: Job opening tracker

on:
  workflow_dispatch:       # manual only: triggered by the "Run now" button in docs/
    inputs:
      force_apify:
        description: "Force a fresh Apify fetch (skip any cache/skip logic)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: job-tracker
  cancel-in-progress: false   # a button click during a run queues instead of killing it

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job_tracker/requirements.txt

      - run: pip install -r job_tracker/requirements.txt

      - name: Fetch, filter and update docs/jobs.json
        run: python job_tracker/track.py
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          FORCE_APIFY: ${{ inputs.force_apify }}

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update job openings"
            git pull --rebase
            git push
          fi
