# =============================================================================
# JOB TRACKER CONFIG
# Edit section 1 (your profile). Sections 2-4 have working defaults.
# =============================================================================

# ---- 1. YOUR PROFILE --------------------------------------------------------
# Used for the Remotive and OpenClaw (LinkedIn/Naukri/Glassdoor) searches. Each term costs extra on Apify.
search_terms:            # up to 5; "react" keeps results relevant so you don't pay for rows that get filtered out
  - full stack developer react
  - frontend developer react
  - software developer react
  - SDE 2 react

# A job title must match one include pattern and no exclude pattern (regex, case-insensitive).
title_include:
  - '\bsde[\s-]*(2|ii)\b'
  - 'software (development )?engineer[\s,:-]*(2|ii)\b'
  - 'software (developer|engineer)'
  - '\bsde\b'
  - 'senior software engineer'
  - 'web (developer|engineer|application)'
  - 'front[\s-]?end'
  - 'full[\s-]?stack'
  - '\bmern\b'
  - 'ui[\s/-]*(ux[\s/-]*)?(developer|engineer)'
  - '(java)?script (developer|engineer)|\bjs (developer|engineer)'
  - 'back[\s-]?end'
  - '(java|python|golang|node(\.?js)?|\.net|php|ruby) (developer|engineer)'
  - '\breact\b|react[\s.-]?js'
  - 'next[\s.]?js'
title_exclude:
  - '\bintern(ship)?\b'
  - 'trainee'
  - 'junior'
  - '\bsde[\s-]*(1|i)\b'
  - '\bsde[\s-]*(3|iii)\b'
  - '\bstaff\b'
  - 'principal'
  - 'director'
  - 'manager'
  - 'head of'
  - '\bvp\b'
  - 'architect'
  - '\b(ios|android)\b'
  - 'devops|\bsre\b'
  - 'data (engineer|scientist)'
  - 'machine learning|\bml\b'
  - 'in test|\bsdet\b|\bqa\b|quality'

# Skills are matched against title + description (or the skill tags on boards with no description).
# A job is listed under "For you" if it has the right title AND mentions at least ONE of these skills.
skills: [react, reactjs, typescript, javascript, next.js, nextjs, redux, zustand, tanstack, react query,
         angular, vue, svelte, tailwind, sass, webpack, vite, html, css, graphql, websocket, jest,
         testing library, cypress, playwright, node, nodejs, express, mongodb, sql, python,
         java, spring, django, flask, golang, postgres, mysql, redis, kafka, microservices, docker, aws]
min_skill_matches: 1          # raise to 2 for stricter matching
# Optional extra rule: the job must mention one of these. Empty = any skill above is enough.
must_have_any_skill: []

# Your experience band. A job passes if its required years overlap min..max.
experience:
  min: 3
  max: 5
  include_unspecified: true   # keep jobs that don't state years (shown as —)

# any = openings from anywhere in the world (India and abroad, WFH and office); the dashboard has filters for it.
# filter = only the locations below
location_mode: any
locations: [india, gurgaon, gurugram, delhi, noida]
remote_ok: true

new_days: 3                   # mark jobs first seen in the last N days
store_others: true            # also keep every fetched job that did NOT match, with the reason (dashboard 'General' tab)
others_max: 1500              # cap on the Others list (near-misses are kept first)
retention_days: 30            # keep a job this long after it stops being listed (shown as 'no longer listed')

# ---- 2. FREE SOURCES (public job-board APIs, no keys needed) ---------------
# Slug = the part after boards.greenhouse.io/ , jobs.lever.co/ , jobs.ashbyhq.com/
# Wrong slugs just log a warning. Add the companies YOU care about (India and abroad).
sources:
  # Slugs below are best guesses; a wrong one just logs a warning and is skipped.
  greenhouse: [stripe, airbnb, databricks, cloudflare, twilio, gitlab, figma, discord, coinbase, reddit,
               instacart, lyft, pinterest, dropbox, mongodb, okta, datadog, asana, webflow, gusto, brex]
  lever: [cred, meesho, palantir, spotify]
  ashby: [notion, linear, ramp, openai, deel]
  remoteok: true                                   # remote, worldwide
  himalayas: [react, frontend developer, full stack developer]   # remote, worldwide (needs a link back, see dashboard footer)
  jobicy: [react, frontend, full stack]            # remote jobs by region
  arbeitnow: true                                  # Germany / EU tech jobs, many with relocation support
  remotive_queries: [react, frontend, full stack]  # short words work best here (max ~3 requests/day)

# ---- 3. APIFY (OPTIONAL; needs the APIFY_TOKEN secret) ----------------------
# Each Actor is a separate run. Prices are per result; the openclaw Actor also uses residential
# proxies, billed per GB against your Apify credit. LinkedIn and Naukri block scrapers often, so
# they can return few or no rows on a given day. Watch Apify Console -> Billing after the first run.
#
# Per Actor you can set:
#   search_terms_field: the Actor's input name for keywords (openclaw: searchTerms, deriverge: keywords)
#   search_terms:       override the section-1 terms for this Actor (job-board search boxes like short skills)
apify:
  enabled: true               # no token = skipped automatically
  min_interval_days: 2        # default for every Actor; override per Actor
  max_charge_usd: 1.5         # hard cap on per-result charges for each Actor run
  timeout_s: 900
  actors:
    # --- LinkedIn + Glassdoor (worldwide) --------------------------------------------------------
    - id: openclawai/job-board-scraper
      name: linkedin-glassdoor
      min_interval_days: 3      # pricier (per-result + proxy), so run less often
      min_skill_matches: 1
      input:
        sites: [linkedin, glassdoor]
        countryIndeed: india    # Glassdoor country; add `location:` to narrow LinkedIn
        maxResults: 15          # per site, per search term
        hoursOld: 72
        linkedinFetchDescription: true   # needed so the skills filter has text
        descriptionFormat: markdown
      map: &openclaw_map        # tracker field -> Actor output keys (first non-empty wins)
        id: [id, job_url]
        source: [site]
        title: [title]
        company: [company]
        location: [location]
        url: [job_url, job_url_direct]
        desc: [description, skills, emails]
        experience: [experience_range]
        remote: [is_remote]
    # --- Naukri, through an India residential IP (Naukri blocks datacenter IPs) ------------------
    - id: openclawai/job-board-scraper
      name: naukri
      min_interval_days: 3
      min_skill_matches: 1
      input:
        sites: [naukri]
        maxResults: 15
        hoursOld: 72            # if Naukri returns nothing, try deleting this line
        proxyConfiguration:
          useApifyProxy: true
          apifyProxyGroups: [RESIDENTIAL]
          apifyProxyCountry: IN
      map: *openclaw_map
    # --- Hirist (India tech jobs) - ~$1 per 1,000 jobs, proxies included -------------------------
    - id: deriverge/hirist-jobs-scraper
      name: hirist
      search_terms_field: keywords
      search_terms: [react, frontend developer, full stack developer, software developer]
      min_skill_matches: 1
      input:
        postedWithinDays: 14
        includeDescription: true
        maxItems: 100
      map:
        id: [jobId]
        source_label: hirist
        title: [title]
        company: [company]
        location: [locations]
        url: [url]
        desc: [description, skills]
        experience_min: [experienceMin]
        experience_max: [experienceMax]
        posted: [postedAt]
        remote: [remote]
    # --- Instahyre (India tech jobs) - ~$0.30 per 1,000 jobs; no descriptions, so skills come from tags
    - id: deriverge/instahyre-jobs-scraper
      name: instahyre
      search_terms_field: keywords
      search_terms: [react, frontend developer, full stack developer]
      min_skill_matches: 1
      input:
        experienceYears: 4      # Instahyre's own filter: jobs that fit someone with this many years
        maxItems: 100
      map:
        id: [jobId]
        source_label: instahyre
        title: [title]
        company: [company]
        location: [locations]
        url: [url]
        desc: [skills, companyAbout]
        remote: [workFromHome]
    # --- Foundit (ex-Monster) India - ~$0.50 per 1,000 jobs -------------------------------------
    - id: deriverge/foundit-jobs-scraper
      name: foundit-india
      search_terms_field: keywords
      search_terms: [react, frontend developer, full stack developer, software developer]
      min_skill_matches: 1
      input:
        postedWithinDays: "14"
        sortBy: date
        maxItems: 100
      map: &foundit_map
        id: [jobId]
        source_label: foundit
        title: [title]
        company: [company]
        location: [location]
        url: [url]
        desc: [description, skills]
        experience_min: [experienceMin]
        experience_max: [experienceMax]
        posted: [postedAt]
        remote: [workFromHome]
    # --- Foundit Gulf (UAE, Saudi Arabia, Qatar): jobs outside India ------------------------------
    - id: deriverge/foundit-jobs-scraper
      name: foundit-gulf
      search_terms_field: keywords
      search_terms: [react, frontend developer, full stack developer]
      min_skill_matches: 1
      input:
        site: GULF
        countries: [United Arab Emirates, Saudi Arabia, Qatar]
        postedWithinDays: "14"
        sortBy: date
        maxItems: 80
      map:
        <<: *foundit_map
        source_label: foundit-gulf

# ---- 3b. ALERTS (optional): new jobs are sent to Telegram and/or Discord --------------------------------
# Telegram needs TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID, Discord needs DISCORD_WEBHOOK_URL (repo secrets, see README). Each job is sent once per channel,
# as one digest message. The first run only records a baseline so your group isn't flooded.
notify:
  telegram:
    enabled: true             # no secrets = skipped automatically
    max_jobs: 20              # jobs listed per digest; the rest are summarised as "+N more"
  discord:
    enabled: true
    max_jobs: 100             # jobs listed per digest, per Discord channel; the rest are summarised as "+N more"
    # One Discord webhook per channel. The value is the NAME of the GitHub secret that holds that channel's
    # webhook URL (never put a URL in this file). Each job goes to the one channel that fits it best.
    # Remove this whole `channels:` block to use a single webhook instead (secret DISCORD_WEBHOOK_URL).
    channels:
      frontend: DISCORD_WEBHOOK_FRONTEND
      fullstack: DISCORD_WEBHOOK_FULLSTACK
      backend: DISCORD_WEBHOOK_BACKEND
      # other: DISCORD_WEBHOOK_OTHER   # optional: generic roles that are clearly neither (not announced otherwise)

# ---- 3c. EMAIL DRAFTS (optional, OFF by default) ---------------------------------------------
# When a job post contains a contact email (e.g. "send your resume to hr@company.com"), the tracker saves a
# DRAFT in your Gmail for you to review and send. It NEVER sends anything. Emails are read at run time and
# are not stored in the repo, the dashboard data or the logs. Needs two secrets: GMAIL_ADDRESS and
# GMAIL_APP_PASSWORD (see README). Only jobs in "For you" are used. Placeholders: {recruiter} {title}
# {company} {url} {skills} {name} {headline} {highlights} {links}
apply_drafts:
  enabled: false              # set to true after adding the secrets and editing the profile below
  max_per_run: 10             # drafts created per run
  max_age_days: 14            # ignore posts older than this
  max_recipients: 2           # contact emails put in "To"
  attach_reminder: true       # first line of each draft reminds you to attach your resume
  subject: "Application for {title} - {name}"
  profile:
    name: Abhinandan Goyal
    headline: "I'm a Software Development Engineer 2 with about 4 years of experience building React and TypeScript products"
    highlights:
      - "EDIT ME: one line about your strongest project (what you built and the result)"
      - "EDIT ME: another line (scale, ownership or leading engineers)"
    links:
      - "LinkedIn: https://www.linkedin.com/in/abhinandangoyal"
      - "GitHub: https://github.com/AbhinandanSW"
  body: |
    Hi {recruiter},

    I came across the {title} opening at {company} and would like to apply.

    {headline}. A few highlights:
    {highlights}

    My experience lines up with the role ({skills}). I'd be glad to share more or set up a quick call.

    Job link: {url}
    {links}

    Thanks,
    {name}

# ---- 4. SEARCH SHORTCUTS (shown at the bottom of the dashboard; never scraped) -----------------
# Sites that are not fetched automatically. Replace with your own saved searches:
# filter on the site, then copy the address bar URL.
search_links:
  - name: LinkedIn
    url: "https://www.linkedin.com/jobs/search/?keywords=frontend%20engineer%20react&f_TPR=r86400&sortBy=DD"
  - name: Naukri
    url: "https://www.naukri.com/frontend-developer-jobs?experience=4&jobAge=1"
  - name: Wellfound
    url: "https://wellfound.com/role/l/frontend-engineer/india"

user_agent: "job-tracker/1.0 (personal GitHub Action)"
